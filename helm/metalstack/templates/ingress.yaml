{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "metalstack.fullname" . }}-ingress
  namespace: {{ include "metalstack.namespace" . }}
  labels:
    {{- include "metalstack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Backend API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "metalstack.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # Keycloak auth routes
          {{- if .Values.keycloak.enabled }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "metalstack.fullname" . }}-keycloak
                port:
                  number: {{ .Values.keycloak.service.port }}
          {{- end }}
          # Frontend (catch-all, must be last)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "metalstack.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
