apiVersion: v1
kind: Service
metadata:
  name: {{ include "metalstack.fullname" . }}-frontend
  namespace: {{ include "metalstack.namespace" . }}
  labels:
    {{- include "metalstack.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "metalstack.frontend.selectorLabels" . | nindent 4 }}
