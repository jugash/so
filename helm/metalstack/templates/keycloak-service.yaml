{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metalstack.fullname" . }}-keycloak
  namespace: {{ include "metalstack.namespace" . }}
  labels:
    {{- include "metalstack.keycloak.labels" . | nindent 4 }}
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - port: {{ .Values.keycloak.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "metalstack.keycloak.selectorLabels" . | nindent 4 }}
{{- end }}
