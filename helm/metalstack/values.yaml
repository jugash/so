# =============================================================================
# MetalStack Helm Chart — Default Values (Dev Environment)
# =============================================================================

environment: dev
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
global:
  registry: registry.internal.example.com/metalstack
  imagePullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Backend (Spring Boot)
# ---------------------------------------------------------------------------
backend:
  replicaCount: 1

  image:
    repository: registry.internal.example.com/metalstack/backend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

  # Spring Boot application config (injected via ConfigMap env vars)
  config:
    serverPort: "8080"
    springProfiles: dev
    corsOrigins: "http://localhost:5173,http://localhost:3000"
    mailFrom: "metalstack@internal.dev"
    appBaseUrl: "http://localhost:5173"
    loggingLevel: DEBUG

  # Datasource & auth (injected via Secret env vars)
  secrets:
    datasourceUrl: "jdbc:postgresql://metalstack-postgres:5432/metalstack"
    datasourceUsername: "metalstack"
    datasourcePassword: "metalstack"
    keycloakIssuerUri: "http://metalstack-keycloak:8080/realms/metalstack"
    keycloakJwkUri: "http://metalstack-keycloak:8080/realms/metalstack/protocol/openid-connect/certs"
    mailHost: "metalstack-mailhog"
    mailPort: "1025"
    mailUsername: ""
    mailPassword: ""

  # Probes
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 45
    periodSeconds: 15
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

  # HPA
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

# ---------------------------------------------------------------------------
# Frontend (React/Vite + nginx)
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 1

  image:
    repository: registry.internal.example.com/metalstack/frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Application configuration
  config:
    backendServiceName: "metalstack-backend"
    backendServicePort: "8080"
    keycloakUrl: "/auth"

  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  host: metalstack.dev.internal
  tls: []

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  secrets:
    database: "metalstack"
    username: "metalstack"
    password: "metalstack"

  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi

  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - metalstack
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 5

  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - metalstack
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Keycloak
# ---------------------------------------------------------------------------
keycloak:
  enabled: true

  image:
    repository: quay.io/keycloak/keycloak
    tag: "25.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Keycloak admin credentials
  adminUsername: admin
  adminPassword: admin

  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 5
