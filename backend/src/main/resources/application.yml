server:
  port: 8080

spring:
  application:
    name: metalstack

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/metalstack}
    username: ${SPRING_DATASOURCE_USERNAME:metalstack}
    password: ${SPRING_DATASOURCE_PASSWORD:metalstack}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/metalstack}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/metalstack/protocol/openid-connect/certs}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    from: ${MAIL_FROM:metalstack@internal.dev}
    base-url: ${APP_BASE_URL:http://localhost:5173}

logging:
  level:
    com.metalstack: DEBUG
    org.springframework.security: INFO
